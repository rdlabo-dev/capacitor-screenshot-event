<ion-header>
  <ion-toolbar>
    <ion-title> Blank </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item>
      <ion-label>Change Enable</ion-label>
      <ion-toggle slot="end" [(ngModel)]="isEnabled" (ionChange)="initialize($any($event))"></ion-toggle>
    </ion-item>
    <ion-item>
      <ion-label>Notificaation</ion-label>
      @if (didNoticed) {
      <ion-icon slot="end" name="checkmark-circle" [color]="didNoticed ? 'success' : 'danger'"></ion-icon>
      }
    </ion-item>
    <ion-item>
      <ion-label>Screen capture</ion-label>
      <ion-label slot="end">{{ screenCaptureState }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
